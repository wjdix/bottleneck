[package]
name = "bottleneck"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
ratatui = "0.30"
reqwest = { version = "0.13", features = ["json", "rustls", "rustls-native-certs", "http2", "charset", "system-proxy"], default-features = false }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
toml = "0.9"
